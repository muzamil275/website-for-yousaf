<title>Page not found — Yousaf Journal</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--bg:#f7f3ef;--paper:#fffdf9;--ink:#17131a;--muted:#716b72;--line:#ded6d2;--burg:#681f3b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(680px,100%);background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:48px;box-shadow:0 24px 70px rgba(41,20,31,.12)}
.mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#681f3b,#63418f);display:grid;place-items:center;color:#fff;font:700 23px Georgia,serif}
.eyebrow{margin:24px 0 10px;color:var(--burg);font-size:12px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}
h1{font:700 clamp(42px,8vw,72px)/.95 Georgia,serif;letter-spacing:-.05em;margin:0 0 18px}
p{color:var(--muted);font-size:17px;line-height:1.6;max-width:560px}
a{display:inline-flex;margin-top:14px;background:var(--burg);color:#fff;text-decoration:none;border-radius:13px;padding:13px 18px;font-weight:800}
@media(max-width:620px){main{padding:32px 24px}}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">Y</div>
<div class="eyebrow">Yousaf Journal</div>
<h1>This page wandered off.</h1>
<p>The address you opened does not match a page in the journal. Head back to the publication and keep reading.</p>

</body>
